<svg xmlns="http://www.w3.org/2000/svg" width="860" height="76" viewBox="0 0 860 76">
  <defs>
    <linearGradient id="snakeGlassBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191a1e"/>
      <stop offset="6%" stop-color="#111215"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <linearGradient id="snakeSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="snakeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
      .font-mono { font-family: "SF Mono", Menlo, Consolas, monospace; }

      @keyframes snakeCrawl {
        0% { transform: translateX(0px); }
        50% { transform: translateX(580px); }
        100% { transform: translateX(0px); }
      }
      .snake-runner { animation: snakeCrawl 18s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="860" height="76" rx="12" fill="url(#snakeGlassBg)"/>
  <rect width="860" height="38.0" rx="12" fill="url(#snakeSheen)"/>
  <rect x="0.5" y="0.5" width="859" height="75" rx="12" fill="none" stroke="url(#snakeBorder)" stroke-width="1"/>

  <!-- Top Title -->
  <g transform="translate(24, 24)">
    <text x="0" y="0" fill="#f5f5f7" class="font-sans" font-size="12" font-weight="600">Daily Contribution Activity Matrix</text>
    <text x="680" y="0" fill="#30d158" class="font-mono" font-size="11">● Auto-Sync Active</text>
  </g>

  <!-- Track Grid -->
  <g transform="translate(24, 36)" opacity="0.4">
    <line x1="0" y1="12" x2="812" y2="12" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="40" y="7" width="10" height="10" rx="2" fill="#30d158" fill-opacity="0.3"/>
    <rect x="120" y="7" width="10" height="10" rx="2" fill="#30d158" fill-opacity="0.6"/>
    <rect x="240" y="7" width="10" height="10" rx="2" fill="#30d158" fill-opacity="0.9"/>
    <rect x="380" y="7" width="10" height="10" rx="2" fill="#2997ff" fill-opacity="0.5"/>
    <rect x="520" y="7" width="10" height="10" rx="2" fill="#30d158" fill-opacity="0.7"/>
    <rect x="680" y="7" width="10" height="10" rx="2" fill="#30d158" fill-opacity="0.9"/>
  </g>

  <!-- Snake Crawler -->
  <g class="snake-runner" transform="translate(30, 48)">
    <rect x="0" y="-6" width="12" height="12" rx="3" fill="#2997ff"/>
    <circle cx="8" cy="-2" r="1.5" fill="#08080a"/>
    <rect x="-14" y="-6" width="12" height="12" rx="3" fill="#30d158"/>
    <rect x="-28" y="-6" width="12" height="12" rx="3" fill="#30d158" fill-opacity="0.8"/>
    <rect x="-42" y="-6" width="12" height="12" rx="3" fill="#30d158" fill-opacity="0.5"/>
    <rect x="-56" y="-6" width="12" height="12" rx="3" fill="#30d158" fill-opacity="0.3"/>
  </g>
</svg>
