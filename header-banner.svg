<svg xmlns="http://www.w3.org/2000/svg" width="860" height="120" viewBox="0 0 860 120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <linearGradient id="bannerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      @keyframes typing {
        0% { width: 0; }
        50% { width: 100%; }
        100% { width: 100%; }
      }

      @keyframes cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      .title-text {
        font-size: 26px;
        font-weight: 800;
        fill: url(#textGrad);
        letter-spacing: -0.5px;
      }

      .subtitle {
        font-size: 14px;
        fill: #8b949e;
        font-weight: 500;
      }

      .highlight {
        fill: #22d3ee;
        font-weight: 700;
      }

      .cursor-blink {
        animation: cursor 0.9s infinite;
        fill: #22d3ee;
      }
    </style>
  </defs>

  <!-- Background Box -->
  <rect width="860" height="120" rx="12" fill="url(#hbg)"/>
  <rect x="0.5" y="0.5" width="859" height="119" rx="12" fill="none" stroke="url(#bannerGlow)" stroke-width="1.2" opacity="0.6"/>

  <!-- Top macOS Window Dots -->
  <circle cx="24" cy="20" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="20" r="5" fill="#27c93f"/>

  <text x="836" y="24" fill="#8b949e" font-size="11" text-anchor="end">ishaan@github: ~</text>

  <!-- Main Animated Greeting -->
  <g transform="translate(24, 62)">
    <text class="title-text">⚡ Hi, I'm Ishaan Sen 👋</text>
  </g>

  <!-- Subtitle Line -->
  <g transform="translate(24, 94)">
    <text class="subtitle">
      AI Engineer &amp; Full-Stack Developer <tspan fill="#58a6ff">|</tspan> <tspan class="highlight">Agentic Systems &amp; Scalable Web Apps</tspan> <tspan class="cursor-blink">█</tspan>
    </text>
  </g>
</svg>
