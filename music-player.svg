<svg xmlns="http://www.w3.org/2000/svg" width="860" height="75" viewBox="0 0 860 75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="mpbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  
  <rect width="860" height="75" rx="8" fill="url(#mpbg)"/>
  <rect x="0.5" y="0.5" width="859" height="74" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Left Side: Terminal Style Play Command -->
  <text x="20" y="43" fill="#7d8590" font-size="13">
    ishaan@github:~$ <tspan fill="#22d3ee">play_music.sh</tspan> --track <tspan fill="#ffa657">"WhatsApp Audio"</tspan>
  </text>
  
  <!-- Right Side: Music Player Controls & Status -->
  <!-- Progress Bar: looping animation to show it's "playing" -->
  <g transform="translate(480, 31)">
    <!-- Progress border -->
    <rect x="0" y="0" width="200" height="12" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    
    <!-- Progress fill (animated width) -->
    <rect x="1" y="1" width="0" height="10" rx="2" fill="#3fb950">
      <animate attributeName="width" from="0" to="198" dur="15s" repeatCount="indefinite" />
    </rect>
    
    <!-- Timer -->
    <text x="210" y="11" fill="#7d8590" font-size="11">LIVE</text>
  </g>
  
  <!-- Floating Play Button / Playing Status -->
  <g transform="translate(740, 37)">
    <circle cx="0" cy="0" r="12" fill="#3fb950" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Play arrow -->
    <polygon points="-3,-5 6,0 -3,5" fill="#0d1117"/>
    <text x="20" y="4" fill="#c9d1d9" font-size="12" font-weight="bold">Click to Play</text>
  </g>
</svg>
