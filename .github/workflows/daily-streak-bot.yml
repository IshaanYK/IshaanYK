name: Daily GitHub Streak & Contribution Bot

on:
  schedule:
    # 12 distributed runs daily (every 2 hours at :55 UTC)
    - cron: '55 */2 * * *'
  workflow_dispatch:
    inputs:
      commit_count:
        description: 'Number of random commits to generate (leave blank for random 8-14)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  daily-streak-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Configure Git Identity
        run: |
          git config --global user.name "IshaanYK"
          git config --global user.email "isen97509@gmail.com"

      - name: Execute Randomized Multi-Commit Engine
        env:
          GH_PROFILE_USER: IshaanYK
          GIT_COMMIT_EMAIL: isen97509@gmail.com
          INPUT_COMMIT_COUNT: ${{ github.event.inputs.commit_count }}
        run: |
          if [ -n "$INPUT_COMMIT_COUNT" ]; then
            python scripts/random_streak_pusher.py "$INPUT_COMMIT_COUNT"
          else
            # Randomly generate 8 to 14 commits per scheduled run (averaging 100-140 daily commits)
            RANDOM_COUNT=$((8 + RANDOM % 7))
            python scripts/random_streak_pusher.py "$RANDOM_COUNT"
          fi
