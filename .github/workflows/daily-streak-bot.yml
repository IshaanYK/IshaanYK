name: Daily GitHub Streak & Contribution Bot

on:
  schedule:
    # Runs at 00:05 UTC every single day (5:35 AM IST)
    - cron: '5 0 * * *'
    # Runs at 12:05 UTC every single day (5:35 PM IST)
    - cron: '5 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-streak-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Generate Daily Streak Log & Code Entry
        run: |
          python -c "
          import json, datetime, os

          log_file = 'data/daily-streak-log.json'
          os.makedirs('data', exist_ok=True)

          now = datetime.datetime.utcnow().isoformat() + 'Z'
          today_str = datetime.date.today().isoformat()

          try:
              with open(log_file, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except Exception:
              data = {'author': 'Ishaan Sen', 'streak_entries': []}

          entry = {
              'timestamp': now,
              'date': today_str,
              'status': 'verified_active',
              'quest': 'Autonomous AI Multi-Agent Optimization & System Architecture',
              'buff': 'Daily Streak Booster Active'
          }

          data['streak_entries'].append(entry)
          data['last_updated'] = now
          data['total_active_days'] = len(data['streak_entries'])

          with open(log_file, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)

          print(f'[OK] Recorded daily contribution for {today_str}')
          "

      - name: Scrape Contributions & Update Heatmap
        env:
          GH_PROFILE_USER: IshaanYK
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
          python scripts/make_header_banner.py
          python scripts/make_music_player.py
          python scripts/make_info_card.py
          python scripts/make_gaming_hud.py
          python scripts/make_retro_snake.py

      - name: Commit and Push Daily Contribution
        run: |
          git config --global user.name "IshaanYK"
          git config --global user.email "ishaansenres@gmail.com"
          git add data/daily-streak-log.json data/contributions.json contrib-heatmap.svg header-banner.svg info-card.svg music-player.svg gaming-hud.svg retro-snake.svg
          
          # Commit with verified IshaanYK identity so GitHub credits contribution graph
          if ! git diff --cached --quiet; then
            git commit -m "feat(streak): automated daily contribution & profile sync [$(date -u +'%Y-%m-%d')]"
            git push
          else
            echo "No changes to commit today."
          fi
